[package]
name = "sumeru"
version = "0.4.0"
description = "Local MCP funnel desktop app"
authors = ["Pratyush Chauhan"]
license = "MIT"
edition = "2021"

[lib]
name = "sumeru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri desktop UI. Off (`--no-default-features`) for the headless binary the native
# macOS app bundles as its engine.
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-autostart", "dep:tauri-build", "dep:glib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rmcp = { version = "2.2", features = [
  "client",
  "server",
  "macros",
  "schemars",
  "transport-io",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
  "reqwest",
] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["net", "process", "sync", "time", "rt-multi-thread", "macros", "io-std", "io-util"] }
tokio-stream = "0.1"
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "form"] }
keyring = { version = "4", features = ["v1"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
rand = "0.9"
thiserror = "2"
schemars = "1"
http = "1"
tower = "0.5"
tracing = "0.1"
sha2 = "0.11.0"
base64 = "0.22.1"
open = "5.4.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Match Tauri/gtk stack; used only to filter ayatana tray deprecation noise.
glib = { version = "0.18", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
