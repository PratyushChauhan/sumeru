name: release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Create the release once, so the Linux (Tauri) and macOS (native) jobs upload in parallel.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          [ -n "$TAG" ] || TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "sumeru $TAG" \
            --notes "Desktop builds and portable CLI binaries for macOS and Linux."

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native SwiftUI app + headless universal engine (scripts/build-macos-app.sh).
          - platform: macos-latest
            binary: dist-macos/sumeru
            cli_suffixes: darwin-arm64 darwin-x64
          - platform: ubuntu-22.04
            args: ""
            binary: src-tauri/target/release/sumeru
            cli_suffixes: linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
        if: matrix.platform == 'ubuntu-22.04'

      - name: Build and upload the native macOS app
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/build-macos-app.sh dist-macos
          gh release upload "v$(jq -r .version src-tauri/tauri.conf.json)" dist-macos/sumeru_*_universal.dmg --clobber

      - uses: tauri-apps/tauri-action@v1
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: sumeru ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: Desktop builds and portable CLI binaries for macOS and Linux.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Strip bundled Wayland libs from AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y libfuse2 || true
          chmod +x scripts/strip-appimage-wayland.sh
          ./scripts/strip-appimage-wayland.sh src-tauri/target/release/bundle/appimage
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          gh release upload "${TAG}" "${APPIMAGE}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable CLI binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          BIN="$PWD/${{ matrix.binary }}"
          mkdir -p dist-cli && cd dist-cli
          # macOS builds one universal binary; split it so npm users download only their arch.
          for SUFFIX in ${{ matrix.cli_suffixes }}; do
            NAME="sumeru-v${VERSION}-${SUFFIX}"
            case "$SUFFIX" in
              darwin-arm64) lipo "$BIN" -thin arm64 -output "$NAME" ;;
              darwin-x64) lipo "$BIN" -thin x86_64 -output "$NAME" ;;
              *) cp "$BIN" "$NAME" ;;
            esac
            chmod +x "$NAME"
            strip "$NAME" || true
            if command -v codesign >/dev/null; then codesign --force --sign - "$NAME" || true; fi
            if command -v sha256sum >/dev/null; then sha256sum "$NAME" > "$NAME.sha256"; else shasum -a 256 "$NAME" > "$NAME.sha256"; fi
            gh release upload "v${VERSION}" "$NAME" "$NAME.sha256" --clobber
          done

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC): no NPM_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Sync CLI package version
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          jq --arg v "$VERSION" '.version = $v' packages/cli/package.json > packages/cli/package.json.tmp
          mv packages/cli/package.json.tmp packages/cli/package.json

      - name: Publish npm package
        working-directory: packages/cli
        run: |
          VERSION=$(jq -r .version package.json)
          if curl -fs -o /dev/null "https://registry.npmjs.org/sumeru-mcp/${VERSION}"; then
            echo "sumeru-mcp@${VERSION} already on npm; skip"
            exit 0
          fi
          npm --version
          npm publish --access public
